services:
  bot:
    build: .
    container_name: fightlab-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN:?set DISCORD_TOKEN}
      - TEAM_ROLE_ID=${TEAM_ROLE_ID:-0}
      - INVITES_CHANNEL_ID=${INVITES_CHANNEL_ID:-}
      - TICKET_CATEGORY_ID=${TICKET_CATEGORY_ID:-}
      - TICKET_CLAIMED_CATEGORY_ID=${TICKET_CLAIMED_CATEGORY_ID:-}
      - TICKET_STAFF_ROLE_ID=${TICKET_STAFF_ROLE_ID:-}
      - ROLLE_ID_DE=${ROLLE_ID_DE:-}
      - ROLLE_ID_EN=${ROLLE_ID_EN:-}
      - ROLLE_ID_FR=${ROLLE_ID_FR:-}
      - ROLLE_ID_ES=${ROLLE_ID_ES:-}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - DATA_DIR=/app/data
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
